name: Build Orb Music Windows
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript
        shell: pwsh
        run: |
          node --check Web/desktop-bridge.js
          node test-desktop.cjs
      - name: Build Windows
        shell: pwsh
        run: |
          dotnet restore OrbMusic.Windows.csproj -r win-x64
          dotnet publish OrbMusic.Windows.csproj -c Release -r win-x64 --no-restore --self-contained true -p:WindowsAppSDKSelfContained=true -o publish -maxcpucount:2
          if (!(Test-Path publish/OrbMusic.Windows.exe)) { throw 'Missing executable' }
          if (!(Test-Path publish/Web/index.html)) { throw 'Missing player interface' }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path publish/* -DestinationPath dist/Orb-Music-Windows-portable.zip -CompressionLevel Optimal
      - name: Install Inno Setup
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Package installer
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path $compiler)) { throw 'Inno Setup not found' }
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          & $compiler "/DOrbVersion=$version" installer/OrbMusic.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Orb-Music-Windows
          path: dist/*
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
